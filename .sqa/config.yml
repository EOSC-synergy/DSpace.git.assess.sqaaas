config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/openaire/DSpace:
      branch: master
      repo: https://github.com/openaire/DSpace.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/openaire/DSpace git:
        commands:
        - /usr/bin/env sh .sqa/script.flint_aware_chinchilla.sh
        container: qc.acc_powder_imaginative_termite
  QC.Doc:
    repos:
      github.com/openaire/DSpace find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.wisteria_rugged_coyote.sh
        container: qc.doc_ultramarine_apathetic_sparrow
      github.com/openaire/DSpace git:
        commands:
        - /usr/bin/env sh .sqa/script.wine_tolerant_hawk.sh
        container: qc.doc_cardamom_bubbly_vulture
      github.com/openaire/DSpace markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_perceptive_grizzly.sh
        container: qc.doc_watermelon_exuberant_quoll
  QC.Lic:
    repos:
      github.com/openaire/DSpace licensee:
        commands:
        - /usr/bin/env sh .sqa/script.fandango_ambitious_ocelot.sh
        container: qc.lic_jet_logical_giraffe
  QC.Sty:
    repos:
      github.com/openaire/DSpace checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.denim_content_kirin.sh
        container: qc.sty_cornflower_fair_toucan
      github.com/openaire/DSpace hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.clove_understanding_raven.sh
        container: qc.sty_pearl_studious_grizzly
      github.com/openaire/DSpace jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.wine_funny_raven.sh
        container: qc.sty_ecru_honest_otter
  QC.Ver:
    repos:
      github.com/openaire/DSpace get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.marigold_sociable_donkey.sh
        container: qc.ver_glacier_tactful_donkey
timeout: 5400
