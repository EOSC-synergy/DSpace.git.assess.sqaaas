        commands:
        - /usr/bin/env sh .sqa/script.thunder_dizzy_platypus.sh
        container: qc.sty_tangerine_elated_cheetah
  QC.Ver:
    repos:
      github.com/openaire/DSpace get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.lilac_impulsive_mandrill.sh
        container: qc.ver_jet_intuitive_orangutan
