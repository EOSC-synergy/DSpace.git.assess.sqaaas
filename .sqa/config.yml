config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/openaire/DSpace:
      branch: master
      repo: https://github.com/openaire/DSpace.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/openaire/DSpace git:
        commands:
        - /usr/bin/env sh .sqa/script.plum_vibrant_mongoose.sh
        container: qc.acc_mango_hopeful_piranha
  QC.Doc:
    repos:
      github.com/openaire/DSpace find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.claret_calm_crocodile.sh
        container: qc.doc_walnut_persistent_butterfly
      github.com/openaire/DSpace git:
        commands:
        - /usr/bin/env sh .sqa/script.wave_visionary_opossum.sh
        container: qc.doc_chestnut_loyal_bison
      github.com/openaire/DSpace markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.silver_exuberant_quoll.sh
        container: qc.doc_grege_curious_griffin
  QC.Lic:
    repos:
      github.com/openaire/DSpace licensee:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_content_wolf.sh
        container: qc.lic_red_daring_seal
  QC.Sty:
